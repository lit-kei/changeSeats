<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>席替えプロトタイプ</title>
	<link rel="stylesheet" href="style.css">
	<script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$']],
            displayMath: [["$$", "$$"]]
        },
        options: {
            enableMenu: false
        }
    };
    </script>
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <main>
	 		<h1>席替えシステム</h1>
			<div id="seats">
			</div>

			<label class="toggle-button-1">
				<input type="checkbox" id="animation"/>
			</label>
			<h3>アニメーションをつける</h3>
			<button id="stop">止める</button>
			<button id="shuffle">シャッフルする</button>
			<div class="forMobile">
				<p>クロムブック用のQRコード↓</p>
				<img src="qr.png" alt="QRコード">
			</div>

			<div class="box">
				<h2>フィードバック受付中！</h2>

				<input type="text" id="name" placeholder="名前（任意）">

				<textarea id="comment" placeholder="要望を入力してください"></textarea>

				<div id="message">
					<img src="thanks.png" alt="ありがとうございます" width="320px">
				</div>
				
				<button onclick="send()">送信</button>

			</div>
    </main>
	
        <div id="modal" class="modal">
            <div class="modal-content">
				<div class="spinner" id="spinner"></div>
				<div id="password">
					<button type="button" class="back" onclick="document.getElementById('modal').style.display = 'none';">&times;</button>
					<h2>パスワード</h2>
					<div id="problem">
						<!--
						<p>集合 $S$ を次のように定める． $$ S = \lbrace 1,2,3, \dots, 10 \rbrace $$</p>
						<p>このとき，$2^{10}$ 個ある $S$ の部分集合のうち，その集合の <strong>要素の総積$^{[1]}$</strong>が<br> $6$ の倍数になるようなものはいくつありますか？</p>
						<p>$[1]$： 総積とは与えられた数字全てを掛け合わせたものです．<br>ただし，空集合の総積は $1$ とします．</p>
						-->	
					</div>
					<input type="number" id="input" autocomplete="off">
					<button type="button" id="submit-btn" style="display: block; margin: 0 auto;">確定</button>
				</div>

				<div id="meta">
					
					<button type="button" class="back" onclick="document.getElementById('modal').style.display = 'none';">&times;</button>
					<p id="label">席替えデータ</p>
					<div id="seatsData" class="seat-data">
					</div>
					<button id="fin-btn" style="margin-top: 10px;">Done!</button>
					
				</div>
            </div>
        </div>
	 <script src="main.js" type="module"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>席替えプロトタイプ</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
	 		<h1>席替えシステム</h1>
			<div id="seats">
			</div>

			<label class="toggle-button-1">
				<input type="checkbox" id="animation"/>
			</label>
			<h3>アニメーションをつける</h3>
			<button id="stop">止める</button>
			<button id="shuffle">シャッフルする</button>
			<div class="forMobile">
				<p>クロムブック用のQRコード↓</p>
				<img src="qr.png" alt="QRコード">
			</div>

			<div class="box">
				<h2>フィードバック受付中！</h2>

				<input type="text" id="name" placeholder="名前（任意）">

				<textarea id="comment" placeholder="感想を入力してください"></textarea>

				<button onclick="send()">送信</button>

				<div id="message">
					<img src="thanks.png" alt="ありがとうございます" width="320px">
				</div>
			</div>
    </main>
	 <script src="main.js" type="module"></script>
</body>
</html>
